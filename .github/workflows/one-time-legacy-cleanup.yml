name: One-time legacy cleanup

on:
  push:
    branches:
      - agent/refactor-security-architecture

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-security-architecture
          fetch-depth: 0

      - name: Remove legacy injected script
        run: |
          python - <<'PY'
          from pathlib import Path
          marker = '<script src="https://lib.youware.com/youware-lib.1747145198.js" id="yourware-lib"></script>'
          changed = []
          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace(marker, '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Arquivos alterados:', changed)
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' pages/*.html
          git commit -m "Remove legacy injected scripts"
          git push origin HEAD:agent/refactor-security-architecture
