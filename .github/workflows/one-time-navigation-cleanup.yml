name: One-time navigation cleanup

on:
  push:
    branches:
      - agent/refactor-security-architecture

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/refactor-security-architecture
          fetch-depth: 0

      - name: Fix legacy navigation, access guard and fake client-side code password
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          text = text.replace('href="#" id="nav-page-builder"', 'href="pages/user-view.html" id="nav-page-builder"')
          text = text.replace('<span>Construtor de Páginas</span>', '<span>Visualização de Dados</span>')
          marker = '<script type="module" src="js/features/workspace-permissions/workspace-access-guard.js"></script>'
          if marker not in text:
              text = text.replace(
                  '<script type="module" src="js/main.js"></script>',
                  '<script type="module" src="js/main.js"></script>\n    ' + marker
              )
          index.write_text(text, encoding='utf-8')

          main = Path('js/main.js')
          text = main.read_text(encoding='utf-8')
          pattern = re.compile(r"    const viewCodeLink = document\.getElementById\('view-code-secure-link'\);.*?\n    // Construktor Menu Logic", re.S)
          replacement = '''    const viewCodeLink = document.getElementById('view-code-secure-link');
    if (viewCodeLink) {
        viewCodeLink.addEventListener('click', function(event) {
            event.preventDefault();
            // O repositório é público; uma senha escrita no JavaScript do cliente
            // não oferece segurança real. O visualizador apenas abre o código versionado.
            window.open('pages/code-view.html', '_blank', 'noopener,noreferrer');
        });
    }

    // Construktor Menu Logic'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1 and 'uma senha escrita no JavaScript do cliente' not in text:
              raise SystemExit('Bloco de acesso ao code-view não encontrado para substituição segura.')
          main.write_text(updated if count else text, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/main.js
          git commit -m "Fix navigation and remove client-side code password"
          git push origin HEAD:agent/refactor-security-architecture
