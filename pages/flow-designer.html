<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Designer de Fluxos - Construktor</title>
  <link rel="icon" href="../imagem/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.395.0/dist/umd/lucide.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { font-family: Inter, sans-serif; }
    .flow-canvas { position: relative; width: 100%; height: 100%; overflow: hidden; cursor: grab; background: radial-gradient(circle, #e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
    .dark .flow-canvas { background-color: #0f172a; background-image: radial-gradient(circle, #334155 1px, transparent 1px); }
    .flow-viewport { position: relative; width: 100%; height: 100%; transform-origin: 0 0; }
    .flow-module { position: absolute; user-select: none; touch-action: none; }
    .flow-module.dragging { z-index: 30; transform: scale(1.03); }
    .zoom-controls { position: absolute; bottom: 1rem; left: 1rem; display: flex; flex-direction: column; gap: .5rem; z-index: 40; }
    .zoom-btn { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: .5rem; border: 1px solid #e2e8f0; background: white; box-shadow: 0 2px 4px rgb(15 23 42 / .08); }
    .zoom-indicator { position: absolute; bottom: 1rem; right: 1rem; z-index: 40; border-radius: .5rem; background: rgb(15 23 42 / .78); color: white; padding: .5rem .75rem; font-size: .75rem; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="loading-overlay" class="loading-overlay"><div class="spinner"></div></div>

  <div id="app" class="hidden h-screen w-screen flex-col overflow-hidden">
    <header class="z-30 flex items-center justify-between border-b border-slate-200 bg-white px-4 py-3 shadow-sm dark:border-slate-700 dark:bg-slate-800">
      <div class="relative">
        <button id="construktor-menu-toggle" type="button" class="flex items-center gap-3 rounded-lg p-2 hover:bg-slate-100 dark:hover:bg-slate-700">
          <img src="../imagem/logo.png" alt="Construktor" class="h-9 w-9 rounded-lg">
          <span class="font-bold text-slate-800 dark:text-slate-100">Construktor</span>
          <i id="construktor-toggle-icon" class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
        </button>
        <div id="construktor-menu-dropdown" class="absolute left-0 top-full z-50 mt-2 hidden w-64 rounded-lg border border-slate-200 bg-white p-2 shadow-xl dark:border-slate-700 dark:bg-slate-800">
          <a href="../index.html" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"><i class="fa-solid fa-cubes"></i> Modelador de Módulos</a>
          <a href="flow-designer.html" class="flex items-center gap-3 rounded-md bg-indigo-50 px-3 py-2 text-sm font-medium text-indigo-600"><i class="fa-solid fa-diagram-flow"></i> Designer de Fluxos</a>
          <a href="user-view.html" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700"><i class="fa-solid fa-table"></i> Visualização de Dados</a>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="help-button" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" title="Mostrar dicas"><i class="fa-regular fa-circle-question"></i></button>
        <div class="relative">
          <button id="settings-menu-button" type="button" class="rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid fa-gear"></i></button>
          <div id="user-menu-dropdown" class="absolute right-0 top-full z-50 mt-2 hidden w-64 rounded-lg border border-slate-200 bg-white p-2 shadow-xl dark:border-slate-700 dark:bg-slate-800">
            <div class="flex items-center gap-3 p-2">
              <img id="user-avatar-preview" class="h-9 w-9 rounded-full" alt="Avatar">
              <span id="user-display-name" class="min-w-0 truncate text-sm font-semibold text-slate-700 dark:text-slate-200"></span>
            </div>
            <hr class="my-2 border-slate-200 dark:border-slate-700">
            <button id="theme-toggle-header" type="button" class="theme-toggle flex w-full items-center gap-3 rounded-md px-3 py-2 text-left text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-700">
              <i class="fa-solid fa-sun"></i><i class="fa-solid fa-moon hidden"></i><span>Alternar tema</span>
            </button>
            <a id="logout-button" href="#" class="flex items-center gap-3 rounded-md px-3 py-2 text-sm text-red-600 hover:bg-red-50"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
          </div>
        </div>
      </div>
    </header>

    <main class="flex min-h-0 flex-1">
      <aside class="flex w-72 shrink-0 flex-col border-r border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-800">
        <div class="border-b border-slate-200 p-4 dark:border-slate-700">
          <label for="workspace-select" class="mb-2 block text-xs font-semibold uppercase tracking-wide text-slate-500">Área de trabalho</label>
          <select id="workspace-select" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-700"></select>
        </div>
        <div class="p-4">
          <div class="mb-3">
            <h2 class="font-semibold text-slate-800 dark:text-slate-100">Módulos</h2>
            <p class="text-xs text-slate-500">Arraste um módulo para o canvas.</p>
          </div>
          <div id="quick-tip" class="mb-3 rounded-lg border border-indigo-100 bg-indigo-50 p-3 text-xs text-indigo-700">
            <div class="flex justify-between gap-2"><span>O mesmo módulo aparece apenas uma vez no fluxo.</span><button class="close-tip-btn" data-tip-id="quick-tip" type="button">×</button></div>
          </div>
          <div id="module-list" class="space-y-2"></div>
          <p id="no-modules-message" class="hidden py-6 text-center text-sm text-slate-400">Nenhum módulo encontrado.</p>
        </div>
      </aside>

      <section class="relative min-w-0 flex-1">
        <div id="flow-canvas" class="flow-canvas">
          <div id="flow-viewport" class="flow-viewport"></div>
          <div id="flow-instructions" class="absolute right-4 top-4 z-40 max-w-xs rounded-lg border border-slate-200 bg-white/95 p-3 text-xs text-slate-600 shadow-sm dark:border-slate-700 dark:bg-slate-800/95 dark:text-slate-300">
            <div class="mb-2 flex justify-between gap-3"><strong>Controles</strong><button class="close-tip-btn" data-tip-id="flow-instructions" type="button">×</button></div>
            <div>Scroll: zoom · Arrastar fundo: mover · Espaço: centralizar</div>
          </div>
          <div class="zoom-controls">
            <button id="zoom-in-btn" type="button" class="zoom-btn" title="Aumentar zoom"><i class="fa-solid fa-plus"></i></button>
            <button id="zoom-out-btn" type="button" class="zoom-btn" title="Diminuir zoom"><i class="fa-solid fa-minus"></i></button>
            <button id="zoom-reset-btn" type="button" class="zoom-btn" title="Centralizar"><i class="fa-solid fa-expand"></i></button>
          </div>
          <div id="zoom-indicator" class="zoom-indicator">Zoom: 100%</div>
        </div>
      </section>
    </main>
  </div>

  <template id="flow-module-template">
    <div class="flow-module w-52 rounded-xl border border-slate-200 bg-white p-4 shadow-md dark:border-slate-600 dark:bg-slate-800" data-module-id="" data-module-name="">
      <button type="button" class="remove-module-btn absolute -right-2 -top-2 grid h-6 w-6 place-items-center rounded-full bg-red-500 text-xs text-white" title="Remover módulo"><i class="fa-solid fa-times"></i></button>
      <div class="mb-3 flex items-center gap-3"><div class="grid h-10 w-10 place-items-center rounded-lg bg-indigo-600 text-white"><i class="fa-solid fa-puzzle-piece"></i></div><div><h3 class="module-title text-sm font-bold text-slate-800 dark:text-slate-100"></h3><p class="text-xs text-slate-500">Módulo</p></div></div>
      <span class="entities-count text-xs text-slate-600 dark:text-slate-300">0 entidades</span>
    </div>
  </template>

  <script src="../js/flow-designer.js"></script>
  <script src="../js/dark-mode.js"></script>
</body>
</html>
