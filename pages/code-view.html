<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código-Fonte - Construktor</title>
  <link rel="icon" href="../imagem/logo.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { font-family: Inter, sans-serif; }
    #code-display { font-family: 'Fira Code', monospace; font-size: 13px; line-height: 1.6; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900">
  <header class="sticky top-0 z-30 border-b border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3">
        <img src="../imagem/logo.png" alt="Construktor" class="h-8 w-8 rounded-lg">
        <div><div class="font-bold text-slate-800 dark:text-slate-100">Código-Fonte</div><div class="text-xs text-slate-500">Manifesto atualizado automaticamente</div></div>
      </div>
      <div class="flex items-center gap-2">
        <button id="theme-toggle-header" type="button" class="theme-toggle rounded-lg p-2 text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700" title="Alternar tema"><i class="fa-solid fa-sun"></i><i class="fa-solid fa-moon hidden"></i></button>
        <a href="../index.html" class="rounded-lg px-3 py-2 text-sm font-medium text-indigo-600 hover:bg-indigo-50"><i class="fa-solid fa-arrow-left mr-2"></i>Voltar</a>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-4 py-6">
    <section class="mb-6 rounded-xl border border-slate-200 bg-white p-5 shadow-sm dark:border-slate-700 dark:bg-slate-800">
      <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
        <div>
          <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">Arquivos do projeto</h1>
          <p class="mt-1 text-sm text-slate-500">A lista vem de <code>project-files.json</code>, evitando referências quebradas após reorganizações.</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button id="copy-all-btn" type="button" class="rounded-lg bg-slate-700 px-3 py-2 text-sm font-medium text-white hover:bg-slate-800"><i class="fa-regular fa-copy mr-2"></i>Copiar todos</button>
          <button id="download-all-btn" type="button" class="rounded-lg bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700"><i class="fa-solid fa-download mr-2"></i>Baixar ZIP</button>
        </div>
      </div>
    </section>

    <section class="overflow-visible rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-800">
      <div id="file-tabs" class="relative flex min-h-12 items-center gap-1 overflow-x-auto border-b border-slate-200 px-2 py-1 dark:border-slate-700"><span class="p-3 text-sm text-slate-400">Carregando arquivos…</span></div>
      <div class="flex items-center justify-between gap-3 border-b border-slate-200 px-4 py-2 dark:border-slate-700">
        <div class="min-w-0 truncate text-sm text-slate-500"><i class="fa-regular fa-file mr-2 text-indigo-500"></i><span id="current-file">Carregando…</span></div>
        <div class="flex shrink-0 gap-2">
          <button id="copy-file-btn" type="button" class="rounded-md bg-slate-100 px-2.5 py-1 text-xs text-slate-700 hover:bg-slate-200">Copiar</button>
          <button id="download-file-btn" type="button" class="rounded-md bg-indigo-100 px-2.5 py-1 text-xs text-indigo-700 hover:bg-indigo-200">Baixar</button>
        </div>
      </div>
      <div class="max-h-[70vh] overflow-auto bg-[#282c34] p-1">
        <pre class="m-0"><code id="code-display" class="language-plaintext">Carregando…</code></pre>
      </div>
    </section>
  </main>

  <script type="module" src="../js/code-view.js"></script>
  <script src="../js/dark-mode.js"></script>
</body>
</html>
